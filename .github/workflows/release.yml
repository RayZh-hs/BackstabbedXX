name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v1.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the version tag belongs to main
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag such as v1.1.0, got: $RELEASE_TAG" >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Build the modpack and resource pack
        run: make

      - name: Check the archives
        run: |
          python3 -m zipfile -t 'dist/Backstabbed++.zip'
          python3 -m zipfile -t 'dist/backstabbed-resource.zip'

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- Backstabbed++.zip backstabbed-resource.zip > SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Backstabbed++ ${RELEASE_TAG#v}" \
            --generate-notes \
            'dist/Backstabbed++.zip' \
            'dist/backstabbed-resource.zip' \
            'dist/SHA256SUMS'
